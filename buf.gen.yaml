# Regenerate with: buf generate && goimports -w proto/uploader/v1/*.go
# Plugin versions are pinned so regeneration reproduces the committed code.
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: proto
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.1
    out: proto
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
